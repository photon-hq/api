name: Build release files

# Builds the four release files of a release candidate: the npm tarball, the
# Python wheel and sdist, and the crate. Photon's release process downloads
# exactly these files, runs its production smoke test on them, records their
# SHA-256s, and after approval attaches them to the GitHub release; the
# release workflow publishes them unchanged. Each file gets a GitHub build
# attestation here.
on:
  push:
    branches: [release-candidate]

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  typescript:
    name: npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Build
        run: |
          npm ci
          mkdir -p dist
          npm pack --workspace @photon-ai/api --pack-destination dist
          mkdir "$RUNNER_TEMP/extracted" && tar -xzf dist/*.tgz -C "$RUNNER_TEMP/extracted"
          node tools/public-content/check.mjs --tree "$RUNNER_TEMP/extracted"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-npm
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90

  python:
    name: Python wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install hatchling==1.31.0
          (cd packages/python && python -m hatchling build -d "$GITHUB_WORKSPACE/dist")
          mkdir "$RUNNER_TEMP/extracted"
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"; done
          node tools/public-content/check.mjs --tree "$RUNNER_TEMP/extracted"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pypi
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  rust:
    name: Crate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Build
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          # The release workflow packages the tagged source again before
          # cargo publish and requires the same bytes as this file.
          cargo package --locked -p photonhq-api
          mkdir -p dist "$RUNNER_TEMP/extracted"
          cp target/package/photonhq-api-*.crate dist/
          tar -xzf dist/*.crate -C "$RUNNER_TEMP/extracted"
          node tools/public-content/check.mjs --tree "$RUNNER_TEMP/extracted"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-crate
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 90

  # GitHub build attestations for the four files. No dependency code runs here.
  attest:
    needs: [typescript, python, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check the version and the file set
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -eq 4
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tgz
            dist/*.whl
            dist/*.tar.gz
            dist/*.crate
