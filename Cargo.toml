[workspace]
members = ["packages/rust", "tools/rust-codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/photon-hq/api"
rust-version = "1.88"

[workspace.dependencies]
# The published SDK uses compatible ranges so it can share a dependency graph
# with its consumers; Cargo.lock keeps development at the tested minimums.
# Generator-only dependencies stay exact.
anyhow = "=1.0.104"
bytes = "1.12.1"
httpdate = "1.0.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
spargen = { git = "https://github.com/photon-hq/spargen.git", rev = "5319d325543282b25f600a34eba15ac8f96506dd", default-features = false }
syn = { version = "=3.0.3", features = ["full", "extra-traits", "visit-mut"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
